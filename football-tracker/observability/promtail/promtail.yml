# Promtail Configuration for Football Tracker
# Collects logs from Docker containers (stdout/stderr) and forwards to Loki

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

# Positions file to track what has been read
positions:
  filename: /tmp/positions.yaml

# Loki client configuration
clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: football-tracker
    batchwait: 1s
    batchsize: 1048576
    timeout: 10s

scrape_configs:
  # Collect logs from Docker containers (stdout/stderr)
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
        filters:
          - name: label
            values: ["com.docker.compose.project=football-tracker"]

    # Relabel container metadata
    relabel_configs:
      # Extract container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

      # Extract service name from Docker Compose label
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

      # Extract project name
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'

      # Add environment label
      - replacement: 'production'
        target_label: 'environment'

    # Parse JSON logs from backend (slog format)
    pipeline_stages:
      # Try to parse as JSON first
      - json:
          expressions:
            level: level
            timestamp: time
            message: msg
            trace_id: trace_id
            span_id: span_id
            user_id: user_id
            component: component
            method: method
            http_status: http_status
            http_method: http_method
            http_path: http_path
            duration_ms: duration_ms
            error: error
          source: message

      # Extract labels from JSON fields (if parsed successfully)
      - labels:
          level:
          trace_id:
          span_id:
          user_id:
          component:
          http_status:

      # Parse timestamp
      - timestamp:
          source: timestamp
          format: RFC3339
          fallback_formats:
            - Unix
            - UnixMs

      # Drop debug logs in production (optional - uncomment to enable)
      # - match:
      #     selector: '{level="debug"}'
      #     action: drop

  # Backend application specific logs
  - job_name: backend
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
        filters:
          - name: label
            values: ["com.docker.compose.service=backend"]

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        target_label: 'container'
      - replacement: 'backend'
        target_label: 'service'
      - replacement: 'football-tracker'
        target_label: 'job'

    pipeline_stages:
      - json:
          expressions:
            level: level
            time: time
            msg: msg
            trace_id: trace_id
            span_id: span_id
            user_id: user_id
            component: component
            method: method
            http_status: http_status
            duration_ms: duration_ms

      - labels:
          level:
          trace_id:
          span_id:
          user_id:
          component:
          http_status:

      - timestamp:
          source: time
          format: RFC3339

  # Nginx access logs
  - job_name: nginx-access
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
        filters:
          - name: label
            values: ["com.docker.compose.service=nginx"]

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        target_label: 'container'
      - replacement: 'nginx'
        target_label: 'service'
      - replacement: 'access'
        target_label: 'log_type'

    # Parse nginx access log format
    pipeline_stages:
      # Nginx default log format: '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"'
      - regex:
          expression: '^(?P<remote_addr>[\w\.]+) - (?P<remote_user>[^ ]*) \[(?P<time_local>.*)\] "(?P<method>[^ ]*) (?P<path>[^ ]*) (?P<protocol>[^ ]*)" (?P<status>[\d]+) (?P<body_bytes_sent>[\d]+) "(?P<http_referer>[^"]*)" "(?P<http_user_agent>[^"]*)"'

      - labels:
          method:
          status:

      - timestamp:
          source: time_local
          format: '02/Jan/2006:15:04:05 -0700'

  # PostgreSQL logs
  - job_name: postgres
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
        filters:
          - name: label
            values: ["com.docker.compose.service=postgres"]

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        target_label: 'container'
      - replacement: 'postgres'
        target_label: 'service'

    pipeline_stages:
      # PostgreSQL log format detection
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3} \w+) \[(?P<pid>\d+)\] (?P<level>[A-Z]+):\s+(?P<message>.*)$'

      - labels:
          level:

      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05.000 MST'


