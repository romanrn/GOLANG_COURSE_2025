receivers:
  # OTLP receiver for traces and metrics from application
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Batch processor to reduce number of outgoing connections
  batch:
    timeout: 10s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # Memory limiter to prevent OOM
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Resource processor to add service name if missing
  resource:
    attributes:
      - key: service.name
        value: football-tracker
        action: insert
      - key: deployment.environment
        value: development
        action: insert

extensions:
  # Health check extension for Docker healthcheck
  health_check:
    endpoint: 0.0.0.0:13133

exporters:
  # Tempo exporter for traces
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Prometheus exporter for metrics (exposes /metrics endpoint)
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: football_tracker

  # Debug exporter for development (replaces deprecated logging exporter)
  debug:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 200

service:
  extensions: [health_check]

  pipelines:
    # Traces pipeline
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlp/tempo, debug]

    # Metrics pipeline
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [prometheus, debug]

  telemetry:
    logs:
      level: info
    metrics:
      level: detailed

