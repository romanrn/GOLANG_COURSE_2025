services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: football_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DATABASE_USERNAME}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - football_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Football Tracker Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: football_tracker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=postgres  # Override localhost with postgres service name for Docker
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    # Remove external port exposure - only accessible via nginx
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - football_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthCheck"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  # Nginx Reverse Proxy with HTTPS (production)
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: football_nginx
    restart: unless-stopped
    ports:
      - "80:8080"     # Host:80 → Container:8080 (HTTP redirects to HTTPS)
      - "443:8443"    # Host:443 → Container:8443 (HTTPS)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - football_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  # =============================================================================
  # OBSERVABILITY STACK
  # =============================================================================

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: football_prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    env_file:
      - .env
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - football_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  # Grafana Loki - Log Aggregation
  loki:
    image: grafana/loki:latest
    container_name: football_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    environment:
      # Disable OpenTelemetry SDK to prevent tracing overhead
      - OTEL_SDK_DISABLED=true
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - football_network
    # Note: healthcheck removed - wget not available in grafana/loki image
    # Loki logs confirm it starts successfully

  # Promtail - Log Collection Agent
  promtail:
    image: grafana/promtail:latest
    container_name: football_promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail.yml
    env_file:
      - .env
    volumes:
      - ./observability/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki
    networks:
      - football_network

  # Grafana Tempo - Distributed Tracing
  tempo:
    image: grafana/tempo:latest
    container_name: football_tempo
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo.yml
    environment:
      # Disable OpenTelemetry SDK to prevent self-tracing
      - OTEL_SDK_DISABLED=true
    ports:
      - "${TEMPO_PORT:-3200}:3200"           # Tempo HTTP
      - "${TEMPO_OTLP_GRPC_PORT:-4317}:4317" # OTLP gRPC
      - "${TEMPO_OTLP_HTTP_PORT:-4318}:4318" # OTLP HTTP
      - "${TEMPO_JAEGER_GRPC_PORT:-14250}:14250" # Jaeger gRPC (optional)
    expose:
      - "9095" # Tempo gRPC (query-frontend) for Grafana (internal only)
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    networks:
      - football_network
    # Note: healthcheck removed - wget not available in grafana/tempo image

  # Grafana - Visualization & Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: football_grafana
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=${GRAFANA_USERS_ALLOW_SIGN_UP:-false}
      - GF_SERVER_ROOT_URL=http://localhost:${GRAFANA_PORT:-3000}
      - GF_INSTALL_PLUGINS=${GRAFANA_INSTALL_PLUGINS:-grafana-piechart-panel}
      # Tempo datasource in Grafana 12 may try gRPC streaming for search; disable to force HTTP.
      - GF_FEATURE_TOGGLES_DISABLE=tempoSearchStreaming
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./observability/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    networks:
      - football_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # PostgreSQL Exporter - Database Metrics
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: football_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}?sslmode=disable"
    env_file:
      - .env
    ports:
      - "${POSTGRES_EXPORTER_PORT:-9187}:9187"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - football_network

  # Nginx Exporter - Reverse Proxy Metrics
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: football_nginx_exporter
    restart: unless-stopped
    env_file:
      - .env
    command:
      - '-nginx.scrape-uri=${NGINX_EXPORTER_SCRAPE_URI:-http://nginx:8080/stub_status}'
    ports:
      - "${NGINX_EXPORTER_PORT:-9113}:9113"
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - football_network

volumes:
  postgres_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:

networks:
  football_network:
    driver: bridge
